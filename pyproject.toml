[project]
name = "self-correcting-researcher"
version = "0.1.0"
description = "A LangGraph agent that researches and corrects itself"
readme = "README.md"
# This strictly locks the project to Python 3.12.x
requires-python = ">=3.12, <3.13"

dependencies = [
    # The Core Framework (v1.x released late 2025)
    "langchain==1.1.0",
    "langchain-core==1.1.0",
    
    # The Agent Brain
    "langgraph==1.0.4",
    
    # Integrations
    "langchain-openai==1.1.0",
    "langchain-community==0.4.1",
    "langchain-chroma==1.0.0",
    
    # Vector Database & Utilities
    "chromadb==1.3.5",
    "tiktoken==0.8.0",       # Required for OpenAI token counting
    "beautifulsoup4==4.14.2", # For parsing the blog posts
    "python-dotenv==1.2.1"    # For managing API keys
]

[tool.uv]
# This tells 'uv' (if you use it) to strictly respect these versions
resolution = "lowest-direct"